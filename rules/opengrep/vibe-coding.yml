# itm8 rule pack for common mistakes in vibe-coded web apps. Written for this gate (no third-party
# rule text), so the pack's licence is the repository's. ERROR maps to high, WARNING to medium.
rules:
  - id: secret-in-browser-env
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A variable exposed to the browser (VITE_, NEXT_PUBLIC_, REACT_APP_) looks like a secret. Anything
      with these prefixes is shipped to every visitor. Keep secrets on the server.
    patterns:
      - pattern-either:
          - pattern: import.meta.env.$VAR
          - pattern: process.env.$VAR
      - metavariable-regex:
          metavariable: $VAR
          regex: ^(VITE_|NEXT_PUBLIC_|REACT_APP_).*(SECRET|SERVICE_ROLE|PRIVATE|PASSWORD|API_KEY|TOKEN)
    metadata:
      security-severity: 8.0

  - id: supabase-service-role-in-client
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A Supabase client is created with a service role key. That key bypasses row-level security and
      must never be used in code that runs in the browser.
    patterns:
      - pattern: createClient($URL, $KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*service[_-]?role.*
    metadata:
      security-severity: 9.0

  - id: eval-of-dynamic-code
    languages: [javascript, typescript]
    severity: ERROR
    message: Code is built from a string at runtime (eval or new Function). Use a safe alternative.
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function(...)
    metadata:
      security-severity: 7.5

  - id: raw-html-from-variable
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML is inserted without escaping (dangerouslySetInnerHTML or innerHTML). If any part comes from a
      user, this allows script injection. Sanitize it first.
    pattern-either:
      - pattern: <$EL dangerouslySetInnerHTML={...} />
      - pattern: $EL.innerHTML = $X

  - id: sql-built-with-template-string
    languages: [javascript, typescript]
    severity: ERROR
    message: A SQL statement is built by inserting values into a string. Use parameters instead.
    patterns:
      - pattern-either:
          - pattern: $DB.query(`...${$X}...`, ...)
          - pattern: $DB.execute(`...${$X}...`, ...)
          - pattern: $DB.raw(`...${$X}...`, ...)
    metadata:
      security-severity: 8.5

  - id: tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate checks are turned off, so traffic can be intercepted.
    pattern-either:
      - pattern: |
          { ..., rejectUnauthorized: false, ... }
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    metadata:
      security-severity: 7.5

  - id: cors-allows-any-origin-with-credentials
    languages: [javascript, typescript]
    severity: ERROR
    message: CORS allows any origin together with credentials. Name the allowed origins instead.
    pattern: |
      { ..., origin: "*", ..., credentials: true, ... }
    metadata:
      security-severity: 7.0

  - id: jwt-decoded-without-verification
    languages: [javascript, typescript]
    severity: ERROR
    message: A JWT is decoded without checking its signature. Use jwt.verify with a key.
    pattern: jwt.decode(...)
    metadata:
      security-severity: 7.5
