# The aifactory gate, called from each customer repository (templates/aifactory-gate.yml).
# Runs the project's tests in a job of their own, then the engine image (scanners, verdict policy,
# summary) in the verdict job, on a runner that never ran repository code.
# The required check in the customer's ruleset is "gate / verdict".
name: aifactory gate

on:
  workflow_call:
    inputs:
      zone:
        description: green, yellow or red
        type: string
        required: true
      level:
        description: Responsibility level. 1 is advisory (never blocks); 2 and 3 block on anything but pass.
        type: number
        default: 2
      profile:
        description: Onboarding profile. 'solo' lets an opted-in green-zone repo self-serve ordinary CI/infra changes (secrets, red zone, confirmed critical/high findings and yellow/red infra still need a person); empty keeps the standard policy.
        type: string
        default: ''
      test-command:
        description: The project's test command, run with bash. Empty means no tests are configured.
        type: string
        default: ''
      node-version:
        description: Node version to set up before the test command. Empty skips setup.
        type: string
        default: ''
      working-directory:
        type: string
        default: '.'
      ai-review:
        description: Run the AI review (find, verify, explain) on itm8's review Foundry. Needs the three inputs below, from the customer's page in the AI Factory Management App, where the customer's consent is recorded.
        type: boolean
        default: false
      review-endpoint:
        description: The review Foundry's https origin.
        type: string
        default: ''
      azure-client-id:
        description: Client id of the customer's review identity in itm8's tenant (no secret; GitHub OIDC).
        type: string
        default: ''
      azure-tenant-id:
        description: itm8's tenant id, where the review identity lives.
        type: string
        default: ''
      review-token-scope:
        description: Entra scope of the model token. The account endpoint uses the default; a Foundry project endpoint uses https://ai.azure.com/.default.
        type: string
        default: https://cognitiveservices.azure.com/.default


# No workflow-wide permissions on purpose. The tests job is the only job that runs repository code
# (the project's test command): it gets contents: read and nothing else. The verdict job sets its
# own (contents: read, id-token: write) and runs only the pinned engine image, on a fresh checkout.
# The reuse and comment jobs run no repository code (only the pinned engine image, or gh with the
# job's own token), so they use what the caller grants: actions: read lets a push to main reuse the
# pull request's verdict, and pull-requests: write lets the gate post its result on the pull
# request. A caller that grants neither gets the gate as before. Asking for them here would stop
# every caller that does not.
env:
  # The release workflow replaces this with the digest of the image built from the same commit.
  GATE_IMAGE: ghcr.io/itm8-public/aifactory-review@sha256:0206240ee379561a95364baf7e7973275e7ac79e672e77129917ce70f2b2673c

jobs:
  # A push whose change a pull request's gate run already judged (the same tree on the same base
  # tree, the same gate commit, the same caller inputs) takes that verdict: same change, same verdict,
  # and neither the tests nor the AI review run twice. Without actions: read, or without such a run,
  # the tests and the verdict job run in full.
  reuse:
    name: reuse
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.find.outputs.candidate }}
      reused: ${{ steps.check.outputs.reused }}
    steps:
      - name: Find the pull request's verdict
        id: find
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AIFACTORY_INPUTS: ${{ toJSON(inputs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/reuse" && chmod 0777 "$RUNNER_TEMP/reuse"
          docker run --rm -e GH_TOKEN -e AIFACTORY_INPUTS -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_SHA -e GITHUB_API_URL \
            -v "$RUNNER_TEMP/reuse:/out" "$GATE_IMAGE" find-reusable --out /out
          if [ -f "$RUNNER_TEMP/reuse/reuse-candidate.json" ]; then
            echo "candidate=$(gzip -9c "$RUNNER_TEMP/reuse/reuse-candidate.json" | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi

      # The check the verdict job makes before it takes the verdict, made here first so that the
      # tests job knows whether to run. The checkout is only read, by the engine image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.find.outputs.candidate != '' }}
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check it against this commit
        id: check
        if: ${{ steps.find.outputs.candidate != '' }}
        continue-on-error: true
        env:
          CANDIDATE: ${{ steps.find.outputs.candidate }}
          ZONE: ${{ inputs.zone }}
          LEVEL: ${{ inputs.level }}
          PROFILE: ${{ inputs.profile }}
          AI_REVIEW: ${{ inputs.ai-review && 'on' || 'off' }}
          AIFACTORY_INPUTS: ${{ toJSON(inputs) }}
          AIFACTORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          AIFACTORY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/check" "$RUNNER_TEMP/in" && chmod 0777 "$RUNNER_TEMP/check"
          echo "$CANDIDATE" | base64 -d | gunzip > "$RUNNER_TEMP/in/candidate.json"
          set +e
          docker run --rm -e AIFACTORY_INPUTS -e AIFACTORY_OWNER_TYPE -e AIFACTORY_RUN_URL \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/check:/out" -v "$RUNNER_TEMP/in:/in:ro" \
            "$GATE_IMAGE" reuse --repo /repo --out /out --from /in/candidate.json --zone "$ZONE" --level "$LEVEL" \
            --base HEAD^1 --ai-review "$AI_REVIEW" --profile "$PROFILE"
          case $? in
            0|1) echo "reused=true" >> "$GITHUB_OUTPUT" ;;
          esac

  # The project's tests, in a job of their own: the only job of the gate that runs repository code.
  # It gets contents: read and nothing else (no OIDC token), and passes the verdict job one word.
  # The verdict job then scans a fresh checkout on another runner, so nothing a test does (change
  # files, replace docker, rewrite the verdict file, read a token from the runner's memory with
  # sudo) reaches what is scanned or decided. Skipped when no test command is set, and on a push
  # that reuses the pull request's verdict. The job fails when the tests fail, so the check
  # "gate / tests" shows it and "Re-run failed jobs" runs them again; the verdict decides as before.
  tests:
    name: tests
    needs: reuse
    if: ${{ !cancelled() && inputs.test-command != '' && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ inputs.node-version != '' }}
        with:
          node-version: ${{ inputs.node-version }}

      - name: Tests
        id: tests
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -eo pipefail -c "$TEST_COMMAND"

  verdict:
    name: verdict
    needs: [reuse, tests]
    # Runs whether the reuse job ran (pushes only), found a verdict or not, and whatever the tests
    # job did: the Test outcome step turns that into what the policy reads. always(), not
    # !cancelled(): this job waits for the tests, and a required check whose job is skipped counts
    # as passed. A run cancelled while the tests run must still end here, in a failed check.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # only used when ai-review is on: the OIDC token for the review Foundry
    outputs:
      comment: ${{ steps.comment.outputs.text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the verdict compares the merge commit (or the pushed commit) with its parent.
          fetch-depth: 2

      # The engine checks the candidate against this checkout itself (tree, base tree, inputs,
      # versions), as the reuse job did. Exit 0 or 1: reused, with that verdict. Anything else: the
      # gate runs in full, and as the tests job was skipped for this push, its tests did not run.
      - name: Reuse the pull request's verdict
        id: reuse
        if: ${{ needs.reuse.outputs.reused == 'true' }}
        continue-on-error: true
        env:
          CANDIDATE: ${{ needs.reuse.outputs.candidate }}
          ZONE: ${{ inputs.zone }}
          LEVEL: ${{ inputs.level }}
          PROFILE: ${{ inputs.profile }}
          AI_REVIEW: ${{ inputs.ai-review && 'on' || 'off' }}
          AIFACTORY_INPUTS: ${{ toJSON(inputs) }}
          AIFACTORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          AIFACTORY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/gate" "$RUNNER_TEMP/in" && chmod 0777 "$RUNNER_TEMP/gate"
          echo "$CANDIDATE" | base64 -d | gunzip > "$RUNNER_TEMP/in/candidate.json"
          set +e
          docker run --rm -e AIFACTORY_INPUTS -e AIFACTORY_OWNER_TYPE -e AIFACTORY_RUN_URL \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/gate:/out" -v "$RUNNER_TEMP/in:/in:ro" \
            "$GATE_IMAGE" reuse --repo /repo --out /out --from /in/candidate.json --zone "$ZONE" --level "$LEVEL" \
            --base HEAD^1 --ai-review "$AI_REVIEW" --profile "$PROFILE"
          code=$?
          case $code in
            0) echo "reused=true" >> "$GITHUB_OUTPUT"; echo "outcome=success" >> "$GITHUB_OUTPUT" ;;
            1) echo "reused=true" >> "$GITHUB_OUTPUT"; echo "outcome=failure" >> "$GITHUB_OUTPUT" ;;
            *) echo "::notice title=aifactory gate::The pull request's verdict was not reused (exit $code); the gate runs in full."
               rm -f "$RUNNER_TEMP/gate/"* ;;
          esac

      # What the tests job reported, as one of five words whatever it wrote: not-configured; success
      # only from a tests job that passed; failure from one that finished; else cancelled or skipped,
      # which the policy reads as tests that did not run (a setup step that failed, a timeout, a
      # push whose reuse fell through). Its output is never echoed: it comes from repository code.
      - name: Test outcome
        id: tests
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        env:
          CONFIGURED: ${{ inputs.test-command != '' }}
          JOB: ${{ needs.tests.result }}
          OUTCOME: ${{ needs.tests.outputs.outcome }}
        run: |
          if [ "$CONFIGURED" != true ]; then tests=not-configured
          elif [ "$JOB" = success ] && [ "$OUTCOME" = success ]; then tests=success
          elif { [ "$JOB" = success ] || [ "$JOB" = failure ]; } && [ "$OUTCOME" = failure ]; then tests=failure
          elif [ "$JOB" = cancelled ] || [ "$OUTCOME" = cancelled ]; then tests=cancelled
          else tests=skipped
          fi
          echo "outcome=$tests" >> "$GITHUB_OUTPUT"
          echo "tests: $tests (tests job: ${JOB:-none})"

      # AI review on but a value it needs left empty: no sign-in is tried (it could only fail with a
      # generic error). The engine names the missing values instead, and the policy decides as for
      # a review that did not complete (needs-person).
      - name: AI review values
        id: ai
        if: ${{ inputs.ai-review && steps.reuse.outputs.reused != 'true' }}
        env:
          ENDPOINT: ${{ inputs.review-endpoint }}
          CLIENT_ID: ${{ inputs.azure-client-id }}
          TENANT_ID: ${{ inputs.azure-tenant-id }}
        run: |
          missing=()
          [ -n "${ENDPOINT//[[:space:]]/}" ] || missing+=(review-endpoint)
          [ -n "${CLIENT_ID//[[:space:]]/}" ] || missing+=(azure-client-id)
          [ -n "${TENANT_ID//[[:space:]]/}" ] || missing+=(azure-tenant-id)
          if [ ${#missing[@]} -gt 0 ]; then
            list=$(IFS=,; echo "${missing[*]}")
            echo "missing=$list" >> "$GITHUB_OUTPUT"
            if [ ${#missing[@]} -eq 1 ]; then what="its value is missing: $list. It comes"; else what="its values are missing: ${list//,/, }. They come"; fi
            echo "::warning title=aifactory gate::AI review is on, but $what from the customer's page in the AI Factory Management App."
          fi

      # A failed sign-in does not stop the gate: the engine then records that the AI review did not
      # complete, which the policy turns into needs-person.
      - name: Sign in to the review Foundry
        id: azure
        if: ${{ inputs.ai-review && steps.ai.outputs.missing == '' && steps.reuse.outputs.reused != 'true' }}
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          allow-no-subscriptions: true

      - name: Model token
        id: token
        if: ${{ inputs.ai-review && steps.azure.outcome == 'success' }}
        continue-on-error: true
        env:
          SCOPE: ${{ inputs.review-token-scope }}
        run: |
          token=$(az account get-access-token --scope "$SCOPE" --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Scan and decide
        id: gate
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        continue-on-error: true
        env:
          TESTS: ${{ steps.tests.outputs.outcome }}
          AIFACTORY_MODEL_ENDPOINT: ${{ inputs.review-endpoint }}
          AIFACTORY_MODEL_TOKEN: ${{ steps.token.outputs.token }}
          AIFACTORY_AI_REVIEW_MISSING: ${{ steps.ai.outputs.missing }}
          ZONE: ${{ inputs.zone }}
          LEVEL: ${{ inputs.level }}
          PROFILE: ${{ inputs.profile }}
          AI_REVIEW: ${{ inputs.ai-review && 'on' || 'off' }}
          AIFACTORY_INPUTS: ${{ toJSON(inputs) }}
          AIFACTORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          AIFACTORY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/gate" && chmod 0777 "$RUNNER_TEMP/gate"
          docker run --rm \
            -e AIFACTORY_MODEL_ENDPOINT -e AIFACTORY_MODEL_TOKEN -e AIFACTORY_AI_REVIEW_MISSING \
            -e AIFACTORY_INPUTS -e AIFACTORY_OWNER_TYPE -e AIFACTORY_RUN_URL \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/gate:/out" \
            "$GATE_IMAGE" run --repo /repo --out /out --zone "$ZONE" --level "$LEVEL" --base HEAD^1 \
            --check "tests=$TESTS" --ai-review "$AI_REVIEW" --profile "$PROFILE"

      # No summary means the gate itself did not work (the image, the runner, the engine): an itm8
      # problem, said as one, with the way out for a change that cannot wait.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          AIFACTORY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f "$RUNNER_TEMP/gate/summary.md" ]; then
            mkdir -p "$RUNNER_TEMP/gate"
            {
              echo '## aifactory gate: needs-person'
              echo
              echo '**The gate could not finish: it produced no verdict.** This is an itm8 problem, not a problem with your change.'
              echo
              echo '### Who acts'
              echo
              echo '- **itm8:** the gate itself did not work. Run the job again; if it keeps failing, tell itm8. If the change cannot wait, the customer admin can use the [emergency bypass](https://github.com/itm8-public/aifactory-gate/blob/main/docs/gate-verdicts-explained.md#emergency-bypass).'
              echo
              echo "[The gate run]($AIFACTORY_RUN_URL)"
            } > "$RUNNER_TEMP/gate/outage.md"
            cp "$RUNNER_TEMP/gate/outage.md" "$RUNNER_TEMP/gate/summary.md"
            { echo '<!-- aifactory-gate -->'; cat "$RUNNER_TEMP/gate/outage.md"; } > "$RUNNER_TEMP/gate/comment.md"
          fi
          cat "$RUNNER_TEMP/gate/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment text
        id: comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if [ -f "$RUNNER_TEMP/gate/comment.md" ]; then
            echo "text=$(gzip -9c "$RUNNER_TEMP/gate/comment.md" | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aifactory-verdict
          path: ${{ runner.temp }}/gate/verdict.json
          if-no-files-found: warn
          retention-days: 90

      # The engine exits 0 for pass or an advisory level, 1 otherwise. A missing verdict never passes.
      # always(): this job may run in a cancelled run, and must not end green with its steps skipped.
      - name: Enforce
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.reuse.outputs.reused == 'true' && steps.reuse.outputs.outcome || steps.gate.outcome }}
          REUSED: ${{ steps.reuse.outputs.reused == 'true' && ' (reused from the pull request)' || '' }}
        run: |
          verdict=$(sed -n 's/^  "verdict": "\([a-z-]*\)".*/\1/p' "$RUNNER_TEMP/gate/verdict.json" 2>/dev/null | head -1)
          echo "verdict=${verdict:-none}${REUSED}, engine step ${OUTCOME}"
          if [ -z "$verdict" ]; then
            echo "::error title=aifactory gate::No verdict: the gate itself did not work (an itm8 problem, not your change). Run the job again; the job summary has the emergency bypass."
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "::error title=aifactory gate::${verdict}${REUSED}. The job summary says who acts, why, and how to fix it."
            exit 1
          fi

  # The result as one pull request comment, updated on every run, so the contributor and their AI
  # tool see who acts and how to fix it on the pull request itself. It needs pull-requests: write
  # from the caller; without it, the job summary has the same text. A first comment is posted only
  # when there is something to do; a later pass updates it.
  comment:
    name: comment
    needs: verdict
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.verdict.outputs.comment != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post or update the comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TEXT: ${{ needs.verdict.outputs.comment }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "$TEXT" | base64 -d | gunzip > "$RUNNER_TEMP/comment.md"
          jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' > "$RUNNER_TEMP/comment.json"
          note() { echo "::notice title=aifactory gate::No pull request comment ($1). The caller can grant pull-requests: write; the job summary has the same text."; }
          if ! gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- aifactory-gate -->"))) | .id' \
              > "$RUNNER_TEMP/ids.txt" 2> "$RUNNER_TEMP/err.txt"; then
            note "$(head -c 200 "$RUNNER_TEMP/err.txt")"; exit 0
          fi
          id=$(head -n1 "$RUNNER_TEMP/ids.txt")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" --input "$RUNNER_TEMP/comment.json" > /dev/null 2> "$RUNNER_TEMP/err.txt" \
              || note "$(head -c 200 "$RUNNER_TEMP/err.txt")"
          elif ! grep -q '^## aifactory gate: pass' "$RUNNER_TEMP/comment.md"; then
            gh api --method POST "repos/$REPO/issues/$PR/comments" --input "$RUNNER_TEMP/comment.json" > /dev/null 2> "$RUNNER_TEMP/err.txt" \
              || note "$(head -c 200 "$RUNNER_TEMP/err.txt")"
          fi
