# Publishes a release: tests, builds and pushes the engine image, writes its digest into gate.yml on a
# release commit, tags that commit vX.Y.Z and moves the major tag (v0, v1, ...) to it.
# Started by hand with the version in package.json. The image package must be public once, by hand,
# so customer repositories can pull it without signing in.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, equal to package.json (for example 0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - id: v
        run: node scripts/release.mjs check "${{ inputs.version }}"
      - run: npm test

      - name: Build and push the image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aifactory-review
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          node scripts/build-image.mjs "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Release commit and tags
        env:
          REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.v.outputs.version }}
          MAJOR: ${{ steps.v.outputs.major }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs pin "$REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v$VERSION runs $REF"
          git tag "v$VERSION"
          git tag -f "$MAJOR"
          git push origin "v$VERSION"
          git push -f origin "$MAJOR"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes "Engine image: \`$REF\`. Callers on \`@$MAJOR\` get this release."
