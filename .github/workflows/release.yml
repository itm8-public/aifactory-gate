# Builds, attests and pushes the engine image for a release and prints its digest. The release commit
# and tags are made by a maintainer (see README, Release): GitHub does not let the workflow token push a
# commit that changes a workflow file, and gate.yml carries the digest.
# Started by hand with the version in package.json. The image package must be public once, by hand,
# so customer repositories can pull it without signing in.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, equal to package.json (for example 0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - id: v
        run: node scripts/release.mjs check "${{ inputs.version }}"
      - run: npm test

      - name: Build and push the image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aifactory-review
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          node scripts/build-image.mjs "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Next step for the maintainer
        env:
          REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.v.outputs.version }}
          MAJOR: ${{ steps.v.outputs.major }}
          NEXT: ${{ steps.v.outputs.next }}
        run: |
          {
            echo "### Image pushed"
            echo "\`$REF\`"
            echo
            echo "**1. Publish to the prerelease channel (\`$NEXT\`)** from a clone of main. This does not"
            echo "touch the stable channel \`$MAJOR\`, so default customers are unaffected:"
            echo '```'
            echo "node scripts/release.mjs pin $REF"
            echo "git commit -am \"release: v$VERSION runs $REF\""
            echo "git tag v$VERSION && git tag -f $NEXT"
            echo "git push origin v$VERSION && git push -f origin $NEXT"
            echo "gh release create v$VERSION --verify-tag --title v$VERSION --notes \"Engine image: $REF\" --prerelease"
            echo "git reset --hard origin/main   # the release commit lives on the tags, not on main"
            echo '```'
            echo
            echo "**2. Canary:** real runs of \`gate.yml@$NEXT\` on the known cases. It records the"
            echo "commit status \`aifactory/canary\` on the release commit; if it is red, \`@$MAJOR\` does not move:"
            echo '```'
            echo "node scripts/canary.mjs"
            echo '```'
            echo
            echo "**3. Soak:** 48 hours on itm8's own repositories that call \`@$NEXT\`, with no gate problem."
            echo
            echo "**4. Promote to stable (\`@$MAJOR\`).** This rolls it out to every \`@$MAJOR\` customer. The command"
            echo "refuses without a green canary on the same commit and is a dry run until \`--apply\`:"
            echo '```'
            echo "node scripts/release.mjs promote $VERSION"
            echo "node scripts/release.mjs promote $VERSION --apply"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
