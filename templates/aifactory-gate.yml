# itm8 AI Factory gate. Copy to .github/workflows/aifactory-gate.yml in your repository.
# The ruleset on main requires the check "gate / verdict". Do not rename the job "gate".
name: aifactory gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # the gate signs in to itm8's review Foundry with GitHub OIDC when ai-review is on

jobs:
  gate:
    # @v0 is the stable channel. To soak a prerelease before it is promoted, pin @v0-next instead.
    uses: itm8-public/aifactory-gate/.github/workflows/gate.yml@v0
    with:
      zone: green # green, yellow or red, as registered for the solution
      level: 2 # 1 advisory (never blocks); 2 and 3 block on anything but pass
      # profile: solo # self-service: the gate self-serves green-zone CI/infra changes. Set up the
      #               # repository with `setup-repo.mjs --profile solo`. Secrets, the red zone,
      #               # confirmed critical/high findings and yellow/red infra still need a person.
      node-version: '24'
      test-command: npm ci && npm test
      # The AI review, once the customer has agreed to it and itm8 has provisioned the identity
      # (see docs/ai-review-onboarding.md). At solo onboarding, set ai-review: true with the three
      # values below only when they are provided; leaving them empty keeps the review off.
      ai-review: false
      review-endpoint: ''
      azure-client-id: ''
      azure-tenant-id: ''
